/*
 * Root build script for TzamalGameEngine.
 *
 * This file holds configuration shared by every subproject (engine, `"generic" game`)
 * so individual build.gradle files stay with their own dependencies.
 *
 * Dependency versions are declared once here via ext {} and referenced
 * in subproject scripts as rootProject.ext.<property>.
 */

ext {
    lwjglVersion = '3.3.6'
    jomlVersion  = '1.10.8'
    imguiVersion = '1.89.0'

    /*
     * LWJGL ships platform-specific native libraries as separate Maven
     * artifacts distinguished by a classifier such as "natives-windows".
     * We detect the OS at configuration time so each subproject can
     * simply reference ${lwjglNatives} without caring about the host.
     * https://www.lwjgl.org/source
     * https://javadoc.lwjgl.org/
     *
     */
    switch (org.gradle.internal.os.OperatingSystem.current()) {
        case { it.isLinux() }:
            lwjglNatives = 'natives-linux'
            imguiNativesArtifact = 'imgui-java-natives-linux'
            break
        case { it.isMacOsX() }:
            lwjglNatives = System.getProperty('os.arch') == 'aarch64'
                    ? 'natives-macos-arm64'
                    : 'natives-macos'
            imguiNativesArtifact = 'imgui-java-natives-macos'
            break
        case { it.isWindows() }:
            lwjglNatives = 'natives-windows'
            imguiNativesArtifact = 'imgui-java-natives-windows'
            break
    }
}

subprojects {
    apply plugin: 'java'

    group = 'me.alextzamalis'
    version = '1.0-SNAPSHOT'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    repositories {
        mavenCentral()
    }

    dependencies {
        testImplementation platform('org.junit:junit-bom:5.10.0')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    test {
        useJUnitPlatform()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
        options.addBooleanOption('Xdoclint:none', true)
    }
}
